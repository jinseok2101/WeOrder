<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/icons/icon-192.png?v=2"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS PWA 지원 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WeOrder" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>WeOrder — 같이 시켜요</title>
    <script
      type="text/javascript"
      src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=2o8llg6zkn&submodules=geocoder"
    ></script>

    <!-- PWA Service Worker 등록 스크립트 -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) =>
              console.log("WeOrder PWA Service Worker registered!", reg.scope),
            )
            .catch((err) =>
              console.error(
                "WeOrder PWA Service Worker registration failed:",
                err,
              ),
            );
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
